name: Pull request quality

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-backtester-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: scripts/dev/run_tests.sh lint

      - name: Format check
        run: scripts/dev/run_tests.sh format

      - name: Typecheck
        run: scripts/dev/run_tests.sh typecheck

      - name: Tests
        run: scripts/dev/run_tests.sh all
