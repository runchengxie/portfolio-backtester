name: Pull request quality

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-backtester-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out public research contracts
        uses: actions/checkout@v4
        with:
          repository: runchengxie/research-workspace
          path: .ci/research-workspace
          sparse-checkout: |
            src/research_contracts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install public CI dependencies
        run: |
          uv venv --python 3.12
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python \
            numpy pandas pyarrow PyYAML scikit-learn xgboost pytest pytest-cov ruff ty==0.0.55
          uv pip install --python .venv/bin/python \
            "research-dev-metrics @ git+https://github.com/runchengxie/research-dev-metrics.git@e1d6e278b0645a23adb523ada9fa8d4743c2e3bf"
          uv pip install --python .venv/bin/python \
            -e .ci/research-workspace/src/research_contracts
          uv pip install --python .venv/bin/python --no-deps -e .

      - name: Lint
        run: .venv/bin/ruff check src tests scripts

      - name: Format check
        run: .venv/bin/ruff format --check src tests scripts

      - name: Typecheck
        run: .venv/bin/ty check --extra-search-path .ci/research-workspace/src

      - name: Tests
        run: .venv/bin/pytest -q
